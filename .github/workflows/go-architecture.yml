name: go-architecture

on:
  push:
    branches: [main]
    paths:
      - "skills/go-architecture/**"
      - ".github/workflows/go-architecture.yml"
  pull_request:
    paths:
      - "skills/go-architecture/**"
      - ".github/workflows/go-architecture.yml"
  # Weekly run even without commits: new stable Go and the newest
  # golangci-lint can break the example while nobody is touching it.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  example:
    name: golden example (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # oldest: the minimum in go.mod, so the example keeps building for
        # anyone on it. stable: the current release, so new vet checks and
        # deprecations show up here first.
        go: [oldest, stable]
    defaults:
      run:
        working-directory: skills/go-architecture/examples/shop
    steps:
      # Actions are pinned to commit SHAs (tags can be moved); Dependabot
      # keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.go == 'oldest' && 'skills/go-architecture/examples/shop/go.mod' || '' }}
          go-version: ${{ matrix.go == 'stable' && 'stable' || '' }}
          cache: false # the example has no dependencies, so no go.sum

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: go vet
        run: go vet ./...

      # Modernizer suggestions for this toolchain, limited to idioms the
      # go.mod version allows. -diff prints the fixes and fails if any.
      - name: go fix
        run: go fix -diff ./...

      - name: go test (race, includes architecture tests)
        run: go test -race -count=1 ./...

      # Pinned for reproducible pushes and PRs. The weekly run uses the
      # newest release instead; when it fails, fix the example and bump
      # the pin. Dependabot can't update this version.
      - name: golangci-lint
        if: matrix.go == 'stable'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ github.event_name == 'schedule' && 'latest' || 'v2.15.0' }}
          working-directory: skills/go-architecture/examples/shop
